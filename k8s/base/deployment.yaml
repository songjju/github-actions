apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-app
  labels:
    component: flask-backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: lotto-prediction
      component: flask-backend
  template:
    metadata:
      labels:
        component: flask-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"  # Flask 포트
        prometheus.io/path: "/metrics"
    spec:
      # CSV 데이터 초기화 컨테이너
      initContainers:
      - name: csv-data-init
        image: lotto-prediction-app:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "🎰 CSV 데이터 초기화..."
          mkdir -p /app/data/raw /app/data/processed /app/outputs /app/cache
          
          if [ -f /app/data/raw/lotto_results.csv ]; then
            echo "✅ CSV 파일 발견: $(wc -l < /app/data/raw/lotto_results.csv) 행"
          else
            echo "⚠️ CSV 파일 없음. 기본 설정으로 진행"
          fi
          echo "🎯 초기화 완료"
        volumeMounts:
        - name: lotto-data
          mountPath: /app/data
        - name: outputs-data
          mountPath: /app/outputs
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

      containers:
      - name: prediction-app
        image: lotto-prediction-app:latest
        ports:
        - containerPort: 5000  # Flask 기본 포트
          name: http
          protocol: TCP
        
        # 환경변수 (Nginx 관련 제거)
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FLASK_RUN_HOST
          value: "0.0.0.0"
        - name: FLASK_RUN_PORT
          value: "5000"
        
        # ConfigMap 및 Secret 환경변수
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        
        # Flask 앱에 최적화된 리소스
        resources:
          requests:
            memory: "256Mi"   # CSV 데이터 로딩
            cpu: "250m"       # Flask + 예측 계산
          limits:
            memory: "512Mi"   # 천재 공식 계산용
            cpu: "1000m"      # 복잡한 수학 연산용
        
        # Flask 앱 헬스체크
        livenessProbe:
          httpGet:
            path: /health     # Flask 앱의 헬스체크 엔드포인트
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready      # Flask 앱의 준비상태 엔드포인트  
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
        
        # Startup 프로브 (CSV 로딩 시간 고려)
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 6  # 30초 대기
        
        # 볼륨 마운트 (Nginx 관련 제거)
        volumeMounts:
        - name: lotto-data
          mountPath: /app/data
        - name: outputs-data  
          mountPath: /app/outputs
        - name: logs
          mountPath: /app/logs
        # Nginx 설정 볼륨 제거
      
      # 볼륨 정의 (Nginx 관련 제거)
      volumes:
      - name: lotto-data
        persistentVolumeClaim:
          claimName: lotto-data-pvc
      - name: outputs-data
        persistentVolumeClaim:
          claimName: lotto-outputs-pvc
      - name: logs
        emptyDir:
          sizeLimit: 200Mi
      # Nginx config 볼륨 제거
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000