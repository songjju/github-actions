name: Lotto 720 predictor CI Pipeline 🎰
run-name: ${{github.actor}} lotto 720 predictor CI pipeline 🎰

on:
  push:
    branches: [lotto-720]
  pull_request:
    branches: [lotto-720]

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIRECTORY: lotto_720

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    outputs:
      version-tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Print job trigger information
        run: |
          echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event
          echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!
          echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Checkout lotto-720 code
        uses: actions/checkout@v4
        with:
          ref: lotto-720
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          VERSION_TAG="${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version tag: ${VERSION_TAG}"

      - name: Cache pip
        uses: actions/cache@v4
        with: 
          cache: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 safety bandit

      - name: Security vulnerability scan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🔍 Checking for security vulnerabilities in dependencies..."
          safety check --json --output safety-report.json || true
          bandit -r . -f json -o bandit-report.json || true

      - name: Lint with flake8
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🔍 Linting code with flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🧪 Running tests..."
          pytest tests --junitxml=test-results.xml --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-security-reports-${{ steps.version.outputs.tag }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/test-results.xml
            ${{ env.WORKING_DIRECTORY }}/safety-report.json
            ${{ env.WORKING_DIRECTORY }}/bandit-report.json
            ${{ env.WORKING_DIRECTORY }}/htmlcov
            ${{ env.WORKING_DIRECTORY }}/coverage.xml
          retention-days: 5

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/lotto-720'
    steps:
      - name: Checkout lotto-720 code
        uses: actions/checkout@v4
        with:
          ref: lotto-720
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-actions@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lotto-720-predictor
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build-and-test.outputs.version-tag }}
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ env.WORKING_DIRECTORY }}
          file: ./${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}
          format: 'table'
          exit-code: '0'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'push'  # Only run on push, not PR
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true  # Don't fail if upload fails

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-${{ needs.build-and-test.outputs.version-tag }}
          path: trivy-results.sarif
          retention-days: 5

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/lotto-720'
    environment: production

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying Flask app with version: ${{ needs.build-and-test.outputs.version-tag }}"
          echo "Image: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}"
          # Here you would add actual deployment steps
          # For example: kubectl, docker-compose, or cloud provider CLI commands