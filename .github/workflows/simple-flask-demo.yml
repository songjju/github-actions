name: simple flask app deploy
run-name: ${{ github.actor }} simple flask app 🚀

on: 
    push:
        branches: [flask-app]
    pull_request:
        branches: [flask-app]

env:
  PYTHON_VERSION: "3.10"
  WORKING_DIRECTORY: "."

jobs:
  build-and-test:
      runs-on: ubuntu-22.04
      outputs:
        version-tag: ${{ steps.version.outputs.tag }}

      steps:
          - name: Print job trigger information
            run: |
              echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
              echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
              echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

          - name: Checkout flask code
            uses: actions/checkout@v4
            with:
              ref: flask-app
              fetch-depth: 0

          - name: Generate version tag
            id: version
            run: |
              SHORT_SHA=$(git rev-parse --short HEAD)
              TIMESTAMP=$(date +'%Y%m%d%H%M%S')
              VERSION_TAG="${TIMESTAMP}-${SHORT_SHA}"
              echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
              echo "Generated version tag: ${VERSION_TAG}"

          - name: Cache pip
            uses: actions/cache@v4
            with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
              restore-keys: |
                  ${{ runner.os }}-pip-

          - name: Setup Python
            uses: actions/setup-python@v5.1.0
            with:
              python-version: ${{ env.PYTHON_VERSION }}

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install flake8 safety bandit

          - name: Security vulnerability check
            run: |
              echo "🔍 Checking for security vulnerabilities in dependencies..."
              safety check --json --output safety-report.json || true
              bandit -r . -f json -o bandit-report.json || true
            continue-on-error: true

          - name: Code quality check with flake8
            run: |
              echo "🧹 Running code quality checks..."
              # Stop the build if there are Python syntax errors or undefined names
              flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
              # Treat all other errors as warnings
              flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

          - name: Run tests
            run: |
              echo "🧪 Running tests..."
              pytest --junitxml=pytest-results.xml --cov=. --cov-report=xml --cov-report=html

          - name: Upload test results and reports
            uses: actions/upload-artifact@v4
            if: always()  # Upload even if tests fail
            with:
              name: test-and-security-reports-${{ steps.version.outputs.tag }}
              path: |
                ${{ env.WORKING_DIRECTORY }}/pytest-results.xml
                ${{ env.WORKING_DIRECTORY }}/coverage.xml
                ${{ env.WORKING_DIRECTORY }}/htmlcov/
                ${{ env.WORKING_DIRECTORY }}/safety-report.json
                ${{ env.WORKING_DIRECTORY }}/bandit-report.json
              retention-days: 30
  
  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/flask-app'

    steps:
      - name: Checkout flask code
        uses: actions/checkout@v4
        with:
          ref: flask-app
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/simple-flask-app
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build-and-test.outputs.version-tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64  # Multi-platform build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}
          format: 'table'
          exit-code: '0'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'push'  # Only run on push, not PR
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true  # Don't fail if upload fails

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-${{ needs.build-and-test.outputs.version-tag }}
          path: trivy-results.sarif
          retention-days: 30

  deploy:
    needs: [build-and-test, docker-build-and-push]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/flask-app'
    environment: production

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying Flask app with version: ${{ needs.build-and-test.outputs.version-tag }}"
          echo "Image: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}"
          # Here you would add actual deployment steps
          # For example: kubectl, docker-compose, or cloud provider CLI commands