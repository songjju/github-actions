name: Lotto Predictor CI Pipeline
run-name: ${{ github.actor }} Lotto predictor CI pipeline

on:
  push:
    branches: [lotto]
  pull_request:
    branches: [lotto]

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIRECTORY: "."
  IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/lotto-predictor"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    outputs:
      version-tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Print job trigger information
        run: |  
          echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event"
          echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
          echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Checkout lotto code
        uses: actions/checkout@v4
        with:
          ref: lotto
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          VERSION_TAG="${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version tag: ${VERSION_TAG}"

      - name : Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 safety bandit
          
      - name: Security vulnerability scan
        run: |
          echo "🔍 Checking for security vulnerabilities in dependencies..."
          safety check --json --output safety-report.json || true
          bandit -r . -f json -o bandit-report.json || true

      - name: Lint with flake8
        run: |
          echo "🔍 Linting the code with flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          pytest tests --junitxml=test-results.xml --cov=./ --cov-report=xml --cov-report=html 
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-and-security-reports-${{ steps.version.outputs.tag }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/test-results.xml
            ${{ env.WORKING_DIRECTORY }}/safety-report.json
            ${{ env.WORKING_DIRECTORY }}/bandit-report.json
            ${{ env.WORKING_DIRECTORY }}/htmlcov
            ${{ env.WORKING_DIRECTORY }}/coverage.xml
          retention-days: 5

  build-and-push-docker-image:
    needs: build-and-test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/lotto'

    steps:
      - name: Checkout lotto code
        uses: actions/checkout@v4
        with:
          ref: lotto
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build-and-test.outputs.version-tag }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Comprehensive vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.version-tag }}
          format: sarif
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
        continue-on-error: false

      - name: Display scan results
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "📊 Vulnerability scan completed"
            # SARIF에서 주요 정보 추출하여 표시
            jq -r '.runs[0].results[] | select(.level=="error") | .message.text' trivy-results.sarif | head -10
          fi

      - name: Upload Comprehensive scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
        continue-on-error: true

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-${{ needs.build-and-test.outputs.version-tag }}
          path: trivy-results.sarif
          retention-days: 5
  
  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/lotto'

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying Flask app with version: ${{ needs.build-and-test.outputs.version-tag }}"
          echo "Image: ghcr.io/${{ github.repository_owner }}/simple-flask-app:${{ needs.build-and-test.outputs.version-tag }}"
          # Here you would add actual deployment steps
          # For example: kubectl, docker-compose, or cloud provider CLI commands