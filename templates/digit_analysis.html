<!-- templates/digit_analysis.html -->
{% extends "base.html" %}

{% block title %}자릿수 다양성 분석 | 연금복권 AI{% endblock %}

{% block extra_head %}
<style>
.digit-analysis-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

.analysis-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
}

.analysis-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.1;
}

.analysis-title {
    font-size: 2.8rem;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

.analysis-subtitle {
    font-size: 1.2rem;
    opacity: 0.9;
    position: relative;
    z-index: 1;
}

.overview-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.overview-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
}

.overview-card:hover {
    transform: translateY(-5px);
}

.overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.overview-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #2c3e50;
}

.overview-icon {
    font-size: 2rem;
    color: var(--primary-color);
}

.overview-value {
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--primary-color);
    margin-bottom: 10px;
}

.overview-description {
    color: #7f8c8d;
    font-size: 0.9rem;
}

.positions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 25px;
    margin-bottom: 40px;
}

.position-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.3s ease;
}

.position-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.position-header {
    padding: 20px;
    background: linear-gradient(45deg, #f8f9fa, #e9ecef);
    border-bottom: 1px solid #dee2e6;
}

.position-title {
    display: flex;
    justify-content: between;
    align-items: center;
    margin-bottom: 10px;
}

.position-name {
    font-size: 1.3rem;
    font-weight: bold;
    color: #2c3e50;
}

.position-status {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-left: 10px;
}

.status-excellent {
    background: rgba(46, 204, 113, 0.2);
    color: #27ae60;
}

.status-good {
    background: rgba(243, 156, 18, 0.2);
    color: #f39c12;
}

.status-needs_improvement {
    background: rgba(231, 76, 60, 0.2);
    color: #e74c3c;
}

.position-score {
    font-size: 2rem;
    font-weight: bold;
    color: var(--primary-color);
}

.position-content {
    padding: 20px;
}

.metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f8f9fa;
}

.metric-row:last-child {
    border-bottom: none;
}

.metric-label {
    font-weight: 500;
    color: #666;
}

.metric-value {
    font-weight: 600;
    color: #2c3e50;
}

.frequency-chart {
    margin-top: 15px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
}

.frequency-bar {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.frequency-digit {
    width: 30px;
    font-weight: 600;
    color: #2c3e50;
}

.frequency-progress {
    flex: 1;
    height: 20px;
    background: #e9ecef;
    border-radius: 10px;
    overflow: hidden;
    margin: 0 10px;
}

.frequency-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    transition: width 0.8s ease;
}

.frequency-count {
    width: 30px;
    text-align: right;
    font-size: 0.9rem;
    color: #666;
}

.recent-sequence {
    margin-top: 15px;
    padding: 10px;
    background: #f1f3f4;
    border-radius: 8px;
}

.sequence-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: #666;
    margin-bottom: 8px;
}

.sequence-numbers {
    display: flex;
    gap: 8px;
}

.sequence-number {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    border-radius: 6px;
    font-weight: 600;
    border: 2px solid #dee2e6;
    transition: all 0.3s ease;
}

.sequence-number:hover {
    border-color: var(--primary-color);
    transform: scale(1.1);
}

.recommendations {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

.recommendations-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.recommendation-item {
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.recommendation-excellent {
    background: rgba(46, 204, 113, 0.1);
    border-left: 4px solid #27ae60;
}

.recommendation-warning {
    background: rgba(243, 156, 18, 0.1);
    border-left: 4px solid #f39c12;
}

.recommendation-error {
    background: rgba(231, 76, 60, 0.1);
    border-left: 4px solid #e74c3c;
}

.recommendation-icon {
    font-size: 1.1rem;
    margin-top: 2px;
}

.recommendation-text {
    flex: 1;
    line-height: 1.4;
}

.controls-section {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

.controls-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.controls-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: var(--primary-color);
    color: white;
}

.btn-primary:hover {
    background: #5a6fd8;
    transform: translateY(-2px);
}

.btn-success {
    background: #27ae60;
    color: white;
}

.btn-success:hover {
    background: #219a52;
    transform: translateY(-2px);
}

.btn-warning {
    background: #f39c12;
    color: white;
}

.btn-warning:hover {
    background: #e67e22;
    transform: translateY(-2px);
}

.btn-danger {
    background: #e74c3c;
    color: white;
}

.btn-danger:hover {
    background: #c0392b;
    transform: translateY(-2px);
}

.loading {
    display: none;
    text-align: center;
    padding: 40px;
    color: #666;
}

.loading i {
    font-size: 2rem;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
    display: block;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.alert {
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 10px;
}

.alert-success {
    background: rgba(46, 204, 113, 0.1);
    color: #27ae60;
    border-left: 4px solid #27ae60;
}

.alert-error {
    background: rgba(231, 76, 60, 0.1);
    color: #e74c3c;
    border-left: 4px solid #e74c3c;
}

.alert-info {
    background: rgba(52, 152, 219, 0.1);
    color: #3498db;
    border-left: 4px solid #3498db;
}

@media (max-width: 768px) {
    .digit-analysis-container {
        padding: 15px;
    }
    
    .analysis-header {
        padding: 30px 20px;
    }
    
    .analysis-title {
        font-size: 2rem;
    }
    
    .overview-cards {
        grid-template-columns: 1fr;
    }
    
    .positions-grid {
        grid-template-columns: 1fr;
    }
    
    .controls-buttons {
        flex-direction: column;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="digit-analysis-container">
    <div class="analysis-header">
        <h1 class="analysis-title">
            <i class="fas fa-calculator"></i>
            자릿수 다양성 분석
        </h1>
        <p class="analysis-subtitle">
            각 자릿수별 다양성을 실시간으로 모니터링하고 분석합니다
        </p>
    </div>

    <!-- 알림 메시지 -->
    <div id="alert-success" class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span id="success-message"></span>
    </div>
    
    <div id="alert-error" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-message"></span>
    </div>
    
    <div id="alert-info" class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        <span id="info-message"></span>
    </div>

    <!-- 로딩 인디케이터 -->
    <div id="loading" class="loading">
        <i class="fas fa-spinner"></i>
        <div>자릿수 다양성 데이터를 분석하는 중...</div>
    </div>

    <!-- 개요 카드 -->
    <div class="overview-cards" id="overview-cards">
        <!-- 동적으로 생성됨 -->
    </div>

    <!-- 자릿수별 상세 분석 -->
    <div class="positions-grid" id="positions-grid">
        <!-- 동적으로 생성됨 -->
    </div>

    <!-- 권장사항 -->
    <div class="recommendations" id="recommendations">
        <h3 class="recommendations-title">
            <i class="fas fa-lightbulb"></i>
            개선 권장사항
        </h3>
        <div id="recommendations-list">
            <!-- 동적으로 생성됨 -->
        </div>
    </div>

    <!-- 제어 패널 -->
    <div class="controls-section">
        <h3 class="controls-title">
            <i class="fas fa-cogs"></i>
            자릿수 다양성 관리
        </h3>
        <div class="controls-buttons">
            <button class="btn btn-primary" onclick="refreshDigitAnalysis()">
                <i class="fas fa-refresh"></i>
                분석 새로고침
            </button>
            <button class="btn btn-success" onclick="testBatchDiversity()">
                <i class="fas fa-flask"></i>
                배치 테스트 (10개)
            </button>
            <button class="btn btn-warning" onclick="resetDigitHistory()">
                <i class="fas fa-eraser"></i>
                자릿수 기록 초기화
            </button>
            <button class="btn btn-danger" onclick="resetAllDiversity()">
                <i class="fas fa-trash"></i>
                전체 다양성 초기화
            </button>
        </div>
    </div>
</div>

<script>
// 전역 변수
let currentDigitData = null;
let refreshInterval = null;

// 페이지 로드 시 초기화
document.addEventListener('DOMContentLoaded', function() {
    loadDigitAnalysis();
    
    // 자동 새로고침 (30초마다)
    refreshInterval = setInterval(loadDigitAnalysis, 30000);
});

// 페이지 종료 시 정리
window.addEventListener('beforeunload', function() {
    if (refreshInterval) {
        clearInterval(refreshInterval);
    }
});

// 자릿수 분석 데이터 로드
async function loadDigitAnalysis() {
    try {
        showLoading(true);
        
        const response = await fetch('/api/diversity/digits');
        const data = await response.json();
        
        if (data.status === 'success') {
            currentDigitData = data.data;
            updateDigitAnalysisDisplay(data.data);
            showLoading(false);
        } else {
            throw new Error(data.message);
        }
    } catch (error) {
        console.error('자릿수 분석 로드 실패:', error);
        showError('자릿수 분석 데이터를 불러올 수 없습니다: ' + error.message);
        showLoading(false);
    }
}

// 분석 결과 표시 업데이트
function updateDigitAnalysisDisplay(data) {
    updateOverviewCards(data.overall);
    updatePositionsGrid(data.position_stats);
    updateRecommendations(data.recommendations);
}

// 개요 카드 업데이트
function updateOverviewCards(overallData) {
    const container = document.getElementById('overview-cards');
    
    const cards = [
        {
            title: '전체 다양성 점수',
            value: `${overallData.diversity_score}%`,
            description: '6개 자릿수의 평균 다양성 점수',
            icon: 'fas fa-chart-line'
        },
        {
            title: '우수한 자릿수',
            value: `${6 - overallData.problem_positions.length}개`,
            description: `총 ${overallData.total_positions}개 중`,
            icon: 'fas fa-thumbs-up'
        },
        {
            title: '개선 필요',
            value: `${overallData.problem_positions.length}개`,
            description: '다양성 개선이 필요한 자릿수',
            icon: 'fas fa-exclamation-triangle'
        },
        {
            title: '시스템 상태',
            value: overallData.status === 'excellent' ? '우수' : 
                   overallData.status === 'good' ? '양호' : '개선필요',
            description: '전체적인 자릿수 다양성 상태',
            icon: overallData.status === 'excellent' ? 'fas fa-star' : 
                  overallData.status === 'good' ? 'fas fa-check' : 'fas fa-wrench'
        }
    ];
    
    container.innerHTML = cards.map(card => `
        <div class="overview-card">
            <div class="overview-header">
                <h3 class="overview-title">${card.title}</h3>
                <i class="${card.icon} overview-icon"></i>
            </div>
            <div class="overview-value">${card.value}</div>
            <div class="overview-description">${card.description}</div>
        </div>
    `).join('');
}

// 자릿수별 상세 정보 업데이트
function updatePositionsGrid(positionStats) {
    const container = document.getElementById('positions-grid');
    
    container.innerHTML = '';
    
    for (let pos = 1; pos <= 6; pos++) {
        const posKey = `position_${pos}`;
        const data = positionStats[posKey];
        
        if (!data) continue;
        
        const statusClass = `status-${data.status}`;
        const statusText = data.status === 'excellent' ? '우수' :
                          data.status === 'good' ? '양호' : '개선필요';
        
        const card = document.createElement('div');
        card.className = 'position-card';
        
        card.innerHTML = `
            <div class="position-header">
                <div class="position-title">
                    <span class="position-name">${pos}번째 자리 ${pos === 1 ? '(조)' : ''}</span>
                    <span class="position-status ${statusClass}">${data.status_icon} ${statusText}</span>
                </div>
                <div class="position-score">${data.diversity_score}%</div>
            </div>
            <div class="position-content">
                <div class="metric-row">
                    <span class="metric-label">고유 숫자 개수</span>
                    <span class="metric-value">${data.unique_digits}개</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">총 샘플 수</span>
                    <span class="metric-value">${data.total_samples}개</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">최빈 숫자</span>
                    <span class="metric-value">${data.most_common.digit} (${data.most_common.count}회, ${Math.round(data.most_common.ratio * 100)}%)</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">최대 연속</span>
                    <span class="metric-value">${data.max_consecutive}회</span>
                </div>
                
                <div class="frequency-chart">
                    <h4 style="margin-bottom: 10px; font-size: 0.9rem; color: #666;">숫자별 사용 빈도</h4>
                    ${createFrequencyBars(data.frequency_distribution, data.total_samples)}
                </div>
                
                <div class="recent-sequence">
                    <div class="sequence-title">최근 사용된 숫자 (10개)</div>
                    <div class="sequence-numbers">
                        ${data.recent_sequence.map(num => `<div class="sequence-number">${num}</div>`).join('')}
                    </div>
                </div>
            </div>
        `;
        
        container.appendChild(card);
    }
}

// 빈도 막대 그래프 생성
function createFrequencyBars(distribution, total) {
    return Object.entries(distribution)
        .sort(([a], [b]) => parseInt(a) - parseInt(b))
        .map(([digit, count]) => {
            const percentage = (count / total) * 100;
            return `
                <div class="frequency-bar">
                    <div class="frequency-digit">${digit}</div>
                    <div class="frequency-progress">
                        <div class="frequency-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="frequency-count">${count}</div>
                </div>
            `;
        }).join('');
}

// 권장사항 업데이트
function updateRecommendations(recommendations) {
    const container = document.getElementById('recommendations-list');
    
    if (!recommendations || recommendations.length === 0) {
        container.innerHTML = '<div class="recommendation-item recommendation-excellent"><i class="fas fa-check-circle recommendation-icon"></i><div class="recommendation-text">현재 자릿수 다양성이 모두 양호합니다.</div></div>';
        return;
    }
    
    container.innerHTML = recommendations.map(rec => {
        let type = 'recommendation-warning';
        let icon = 'fas fa-exclamation-triangle';
        
        if (rec.includes('✅') || rec.includes('양호')) {
            type = 'recommendation-excellent';
            icon = 'fas fa-check-circle';
        } else if (rec.includes('🔴') || rec.includes('부족')) {
            type = 'recommendation-error';
            icon = 'fas fa-exclamation-circle';
        }
        
        return `
            <div class="recommendation-item ${type}">
                <i class="${icon} recommendation-icon"></i>
                <div class="recommendation-text">${rec}</div>
            </div>
        `;
    }).join('');
}

// 분석 새로고침
async function refreshDigitAnalysis() {
    showInfo('자릿수 분석을 새로고침하는 중...');
    await loadDigitAnalysis();
    showSuccess('자릿수 분석이 새로고침되었습니다');
}

// 배치 다양성 테스트
async function testBatchDiversity() {
    if (!confirm('10개의 테스트 예측을 생성하여 자릿수 다양성을 분석하시겠습니까?')) {
        return;
    }
    
    try {
        showInfo('배치 다양성 테스트를 실행하는 중...');
        
        // 먼저 10개 예측 생성
        const testPredictions = [];
        for (let i = 0; i < 10; i++) {
            try {
                const response = await fetch('/api/predict');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const prediction = data.prediction?.ml_prediction?.number || '000000';
                    testPredictions.push(prediction);
                } else {
                    testPredictions.push(`${Math.floor(Math.random() * 5) + 1}${Math.floor(Math.random() * 100000).toString().padStart(5, '0')}`);
                }
            } catch (predError) {
                console.warn('예측 생성 실패:', predError);
                testPredictions.push(`${Math.floor(Math.random() * 5) + 1}${Math.floor(Math.random() * 100000).toString().padStart(5, '0')}`);
            }
        }
        
        // 배치 분석
        const analysisResponse = await fetch('/api/diversity/analyze-batch', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                predictions: testPredictions
            })
        });
        
        const analysisData = await analysisResponse.json();
        
        if (analysisData.status === 'success') {
            showBatchAnalysisResults(analysisData.data);
            showSuccess('배치 다양성 테스트가 완료되었습니다');
        } else {
            throw new Error(analysisData.message);
        }
        
    } catch (error) {
        console.error('배치 테스트 실패:', error);
        showError('배치 다양성 테스트 실행 실패: ' + error.message);
    }
}

// 배치 분석 결과 표시
function showBatchAnalysisResults(data) {
    const batchInfo = data.batch_info;
    const positionAnalysis = data.position_analysis;
    const summary = data.summary;
    
    let message = `📊 배치 다양성 분석 결과\n\n`;
    message += `🎯 전체 품질: ${batchInfo.quality_message}\n`;
    message += `📈 전체 다양성 점수: ${batchInfo.overall_diversity_score}%\n`;
    message += `📝 분석된 예측: ${batchInfo.total_predictions}개\n\n`;
    
    message += `📊 자릿수별 상태:\n`;
    message += `✅ 우수: ${summary.excellent_positions}개 자리\n`;
    message += `⚠️ 주의: ${summary.warning_positions}개 자리\n`;
    message += `🔴 개선필요: ${summary.poor_positions}개 자리\n\n`;
    
    if (summary.problem_positions.length > 0) {
        message += `🔧 문제 자릿수: ${summary.problem_positions.join(', ')}\n\n`;
    }
    
    message += `🔢 분석된 예측 번호:\n${data.predictions_analyzed.join(', ')}\n\n`;
    
    if (data.improvement_suggestions.length > 0) {
        message += `💡 개선 제안:\n${data.improvement_suggestions.map(s => `• ${s}`).join('\n')}`;
    }
    
    alert(message);
}

// 자릿수 기록 초기화
async function resetDigitHistory() {
    if (!confirm('자릿수별 사용 기록을 모두 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
        return;
    }
    
    try {
        showInfo('자릿수 기록을 초기화하는 중...');
        
        const response = await fetch('/api/diversity/reset-digits', {
            method: 'POST'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            showSuccess(`자릿수 기록이 초기화되었습니다 (총 ${data.data.total_cleared}개 기록)`);
            await loadDigitAnalysis(); // 분석 새로고침
        } else {
            throw new Error(data.message);
        }
        
    } catch (error) {
        console.error('자릿수 기록 초기화 실패:', error);
        showError('자릿수 기록 초기화 실패: ' + error.message);
    }
}

// 전체 다양성 초기화
async function resetAllDiversity() {
    if (!confirm('전체 다양성 시스템을 초기화하시겠습니까?\n• 모든 예측 기록\n• 자릿수별 사용 기록\n• 세션별 기록\n\n이 작업은 되돌릴 수 없습니다.')) {
        return;
    }
    
    try {
        showInfo('전체 다양성 시스템을 초기화하는 중...');
        
        // 일반 다양성 초기화
        const diversityResponse = await fetch('/api/diversity/reset', {
            method: 'POST'
        });
        
        // 자릿수 다양성 초기화
        const digitResponse = await fetch('/api/diversity/reset-digits', {
            method: 'POST'
        });
        
        const diversityData = await diversityResponse.json();
        const digitData = await digitResponse.json();
        
        if (diversityData.status === 'success' && digitData.status === 'success') {
            const totalCleared = (diversityData.data?.cleared_predictions || 0) + (digitData.data?.total_cleared || 0);
            showSuccess(`전체 다양성 시스템이 초기화되었습니다 (총 ${totalCleared}개 기록)`);
            await loadDigitAnalysis(); // 분석 새로고침
        } else {
            throw new Error('일부 초기화 작업이 실패했습니다');
        }
        
    } catch (error) {
        console.error('전체 다양성 초기화 실패:', error);
        showError('전체 다양성 초기화 실패: ' + error.message);
    }
}

// UI 헬퍼 함수들
function showSuccess(message) {
    const alert = document.getElementById('alert-success');
    document.getElementById('success-message').textContent = message;
    alert.style.display = 'flex';
    
    setTimeout(() => {
        alert.style.display = 'none';
    }, 5000);
}

function showError(message) {
    const alert = document.getElementById('alert-error');
    document.getElementById('error-message').textContent = message;
    alert.style.display = 'flex';
    
    setTimeout(() => {
        alert.style.display = 'none';
    }, 8000);
}

function showInfo(message) {
    const alert = document.getElementById('alert-info');
    document.getElementById('info-message').textContent = message;
    alert.style.display = 'flex';
    
    setTimeout(() => {
        alert.style.display = 'none';
    }, 4000);
}

function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
}

// 키보드 단축키
document.addEventListener('keydown', function(e) {
    // F5: 분석 새로고침
    if (e.key === 'F5') {
        e.preventDefault();
        refreshDigitAnalysis();
    }
    
    // Ctrl/Cmd + T: 배치 테스트
    if ((e.ctrlKey || e.metaKey) && e.key === 't') {
        e.preventDefault();
        testBatchDiversity();
    }
    
    // Ctrl/Cmd + R: 자릿수 기록 초기화
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
        e.preventDefault();
        resetDigitHistory();
    }
});
</script>
