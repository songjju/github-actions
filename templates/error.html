{% extends "base.html" %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="error-title">{{ title if title else "오류 발생" }}</h1>
        <p class="error-message">{{ message if message else "시스템 오류가 발생했습니다." }}</p>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> 홈으로 돌아가기
            </a>
            <a href="/api/retrain" class="btn btn-secondary">
                <i class="fas fa-redo"></i> 시스템 재시작
            </a>
        </div>
        
        {% if details %}
        <div class="error-details">
            <button onclick="toggleDetails()" class="btn-text">기술적 세부사항 보기</button>
            <div id="error-details" class="details-content" style="display: none;">
                <pre>{{ details }}</pre>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<script>
function toggleDetails() {
    const details = document.getElementById('error-details');
    if (details.style.display === 'none') {
        details.style.display = 'block';
    } else {
        details.style.display = 'none';
    }
}
</script>

<style>
.error-container {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.error-content {
    text-align: center;
    max-width: 600px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.error-icon {
    font-size: 4rem;
    color: #e74c3c;
    margin-bottom: 20px;
}

.error-title {
    color: #2c3e50;
    font-size: 2rem;
    margin-bottom: 15px;
}

.error-message {
    color: #7f8c8d;
    font-size: 1.1rem;
    margin-bottom: 30px;
    line-height: 1.6;
}

.error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}

.error-details {
    margin-top: 20px;
    text-align: left;
}

.btn-text {
    background: none;
    border: none;
    color: #3498db;
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.9rem;
}

.details-content {
    margin-top: 10px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 5px;
    font-size: 0.8rem;
}

.details-content pre {
    margin: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
}
</style>
{% endblock %}
